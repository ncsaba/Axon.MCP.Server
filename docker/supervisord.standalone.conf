; supervisord.standalone.conf - Process supervisor configuration for single-container deployment
; This file manages all services in the all-in-one Axon MCP container
;
; Location: /etc/supervisor/conf.d/axon.conf (inside container)

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ============================================
; Infrastructure Services
; ============================================

[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main
user=postgres
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.err
priority=100

[program:redis]
command=/usr/bin/redis-server
user=redis
autostart=true
autorestart=true
startsecs=3
startretries=5
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis.err
priority=200

; ============================================
; Application Services
; ============================================

[program:api]
command=/opt/venv/bin/uvicorn src.api.main:app --host 0.0.0.0 --port 8080
directory=/app
user=axon
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err
priority=300
depends_on=postgresql,redis

[program:mcp-server]
command=/opt/venv/bin/python -m src.mcp_server.main
directory=/app
user=axon
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s",MCP_TRANSPORT="http",MCP_HTTP_HOST="0.0.0.0",MCP_HTTP_PORT="8001"
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/mcp.log
stderr_logfile=/var/log/supervisor/mcp.err
priority=310
depends_on=postgresql,redis

[program:worker]
command=/opt/venv/bin/celery -A src.workers.celery_app:celery_app worker --loglevel=info --concurrency=2 --queues=repository_sync,file_parsing,embeddings,inventory,default
directory=/app
user=axon
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err
priority=320
depends_on=postgresql,redis

[program:enrichment-worker]
command=/opt/venv/bin/celery -A src.workers.celery_app:celery_app worker --loglevel=info --concurrency=4 --queues=ai_enrichment,repository_aggregation
directory=/app
user=axon
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/enrichment-worker.log
stderr_logfile=/var/log/supervisor/enrichment-worker.err
priority=330
depends_on=postgresql,redis

[program:beat]
command=/opt/venv/bin/celery -A src.workers.celery_app:celery_app beat --loglevel=info
directory=/app
user=axon
environment=PYTHONPATH="/app",PATH="/opt/venv/bin:%(ENV_PATH)s"
autostart=true
autorestart=true
startsecs=5
startretries=5
stdout_logfile=/var/log/supervisor/beat.log
stderr_logfile=/var/log/supervisor/beat.err
priority=340
depends_on=postgresql,redis

; ============================================
; Event Listeners (optional)
; ============================================

[eventlistener:process_exit]
command=bash -c "echo 'Process exited'"
events=PROCESS_STATE_EXITED
autostart=false
